<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediCare Pro - Advanced Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        .btn-medicare {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            border: none;
            color: white;
        }
        .btn-medicare:hover {
            background: linear-gradient(45deg, #FF5252, #45B7AA);
            color: white;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="login-container p-5 col-md-6 col-lg-4">
            <div class="text-center mb-4">
                <h1 class="text-primary fw-bold">🏥 MediCare Pro</h1>
                <p class="text-muted">Advanced Hospital Management System</p>
            </div>
        <div v-if="!token">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <h2 class="text-center mb-3">🔐 Secure Login</h2>
                    <form @submit.prevent="login" class="mb-4">
                        <div class="mb-3">
                            <input v-model="username" placeholder="Enter your username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <input v-model="password" type="password" placeholder="Enter your password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-medicare w-100">Access Dashboard</button>
                    </form>
                    <h2 class="text-center mb-3">📝 New Patient Registration</h2>
                    <form @submit.prevent="register">
                        <div class="mb-3">
                            <input v-model="reg.username" placeholder="Choose username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <input v-model="reg.password" type="password" placeholder="Create password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <input v-model="reg.email" placeholder="Email address" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <input v-model="reg.name" placeholder="Full Name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <input v-model="reg.contact" placeholder="Phone Number" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Create Patient Account</button>
                    </form>
                </div>
            </div>
        </div>
        <div v-else>
            <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
                <div class="container-fluid">
                    <span class="navbar-brand">Welcome, {{ role }}</span>
                    <button @click="logout" class="btn btn-danger">Logout</button>
                </div>
            </nav>
        </div>
    </div>
    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    token: localStorage.getItem('token'),
                    role: localStorage.getItem('role'),
                    username: '',
                    password: '',
                    reg: {username: '', password: '', email: '', name: '', contact: ''}
                }
            },
            methods: {
                async login() {
                    const res = await fetch('http://localhost:5000/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username: this.username, password: this.password})
                    });
                    const data = await res.json();
                    if (res.ok) {
                        this.token = data.access_token;
                        this.role = data.role;
                        localStorage.setItem('token', this.token);
                        localStorage.setItem('role', this.role);
                        // Redirect to dashboard
                        if (this.role === 'admin') window.location = '/admin';
                        else if (this.role === 'doctor') window.location = '/doctor';
                        else if (this.role === 'patient') window.location = '/patient';
                    } else {
                        alert(data.message);
                    }
                },
                async register() {
                    const res = await fetch('http://localhost:5000/register_patient', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(this.reg)
                    });
                    const data = await res.json();
                    alert(data.message);
                },
                logout() {
                    this.token = null;
                    this.role = null;
                    localStorage.removeItem('token');
                    localStorage.removeItem('role');
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
